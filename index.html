<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BARE</title>
  <style>
    @font-face {
      font-family: "Gotham Book";
      src: url("https://res.cloudinary.com/dq4ubv7so/raw/upload/v1775693333/Gotham-Book_yum8sq.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "F1776_Independence W00 Bold";
      src: url("https://db.onlinewebfonts.com/t/8329fe6f020f516acd3d04d7fd252505.eot");
      src: url("https://db.onlinewebfonts.com/t/8329fe6f020f516acd3d04d7fd252505.eot?#iefix") format("embedded-opentype"),
      url("https://db.onlinewebfonts.com/t/8329fe6f020f516acd3d04d7fd252505.woff2") format("woff2"),
      url("https://db.onlinewebfonts.com/t/8329fe6f020f516acd3d04d7fd252505.woff") format("woff"),
      url("https://db.onlinewebfonts.com/t/8329fe6f020f516acd3d04d7fd252505.ttf") format("truetype"),
      url("https://db.onlinewebfonts.com/t/8329fe6f020f516acd3d04d7fd252505.svg#F1776_Independence W00 Bold") format("svg");
      font-display: swap;
    }

    :root {
      --bg: #ffffff;
      --ink: #000000;
      --line: rgba(0, 0, 0, 0.12);
      --header-offset: 0.85rem;
      --header-width: 980px;
      --panel-width: 960px;
      --copy-width: 640px;
      --header-height: 132px;
      --panel-pad-top: calc(var(--header-height) + 2rem);
      --transition: 180ms ease;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Gotham Book", Arial, sans-serif;
      animation: page-fade 420ms ease both;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    a,
    button {
      color: inherit;
      font: inherit;
    }

    a {
      text-decoration: none;
    }

    button {
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .film-text {
      font-family: "F1776_Independence W00 Bold", Georgia, serif;
    }

    .shell {
      width: min(calc(100% - 1rem), var(--header-width));
      margin: 0 auto;
    }

    .site-header {
      position: fixed;
      top: var(--header-offset);
      left: 50%;
      z-index: 20;
      transform: translateX(-50%);
      width: min(calc(100% - 1rem), var(--header-width));
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--line);
    }

    .site-header__inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 0.9rem 0.85rem;
      text-align: center;
    }

    .header-logo {
      width: min(100%, 138px);
      transition: opacity var(--transition), transform var(--transition);
    }

    .header-logo:hover,
    .header-logo:focus-visible {
      opacity: 0.68;
      transform: translateY(-1px);
      outline: none;
    }

    .site-nav {
      width: 100%;
    }

    .site-nav__links {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.55rem 0.95rem;
      width: 100%;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }

    .nav-link,
    .text-link,
    .gallery-link,
    .donate-link {
      transition: opacity var(--transition), transform var(--transition);
    }

    .nav-link {
      position: relative;
    }

    .nav-link--apply {
      letter-spacing: 0.02em;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -0.16rem;
      width: 100%;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 220ms ease;
    }

    .nav-link.is-active::after,
    .nav-link:hover::after,
    .nav-link:focus-visible::after {
      transform: scaleX(1);
    }

    .nav-link:hover,
    .nav-link:focus-visible,
    .text-link:hover,
    .text-link:focus-visible,
    .gallery-link:hover,
    .gallery-link:focus-visible,
    .donate-link:hover,
    .donate-link:focus-visible {
      opacity: 0.58;
      transform: translateY(-1px);
      outline: none;
    }

    .text-link,
    .donate-link {
      display: inline-block;
      background-image: linear-gradient(currentColor, currentColor);
      background-position: 0 100%;
      background-repeat: no-repeat;
      background-size: 0% 1px;
      transition: background-size 220ms ease, opacity var(--transition), transform var(--transition);
    }index.html

    .text-link:hover,
    .text-link:focus-visible,
    .donate-link:hover,
    .donate-link:focus-visible {
      background-size: 100% 1px;
    }

    main {
      width: 100%;
      padding: var(--panel-pad-top) 0 1rem;
    }

    .view {
      display: none;
      min-height: calc(100svh - var(--panel-pad-top) - 1rem);
      width: 100%;
      align-items: center;
      justify-content: center;
      padding: 1rem 0 2rem;
    }

    .view.is-active {
      display: flex;
    }

    .panel {
      width: min(calc(100% - 1rem), var(--panel-width));
      margin: 0 auto;
      text-align: center;
    }

    .panel__inner {
      width: min(100%, var(--copy-width));
      margin: 0 auto;
    }

    .hero-logo {
      width: min(100%, 330px);
      margin: 0 auto;
    }

    .season {
      margin: 1rem 0 0;
      font-size: clamp(1.05rem, 5.5vw, 1.28rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .tagline {
      width: auto;
      max-width: 100%;
      margin: 1.8rem auto 0;
      font-size: clamp(1.3rem, 7.2vw, 1.92rem);
      line-height: 1.12;
      white-space: nowrap;
    }

    .credits {
      margin: 2.2rem auto 0;
      display: grid;
      gap: 1.35rem;
      justify-items: center;
    }

    .credit-block {
      display: grid;
      gap: 0.2rem;
      justify-items: center;
    }

    .credit-label,
    .credit-name {
      display: block;
      max-width: 100%;
      line-height: 1.06;
    }

    .credit-label {
      font-size: clamp(1.08rem, 5.8vw, 1.46rem);
    }

    .credit-name {
      font-size: clamp(1.22rem, 6.6vw, 1.72rem);
    }

    .section-title {
      margin: 0;
      font-size: clamp(1.95rem, 10vw, 2.9rem);
      line-height: 1;
    }

    .section-subtitle {
      margin: 0.95rem 0 0;
      font-size: 0.9rem;
      letter-spacing: 0.03em;
      overflow-wrap: anywhere;
    }

    .gallery-grid {
      margin-top: 1.9rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      align-items: start;
    }

    .gallery-link {
      display: block;
      width: 100%;
      overflow: hidden;
    }

    .gallery-image {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      transition: transform 240ms ease;
    }

    .gallery-link:hover .gallery-image,
    .gallery-link:focus-visible .gallery-image {
      transform: scale(1.02);
    }

    .cast-list {
      width: min(100%, 700px);
      margin: 2rem auto 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 1rem;
    }

    .cast-list li {
      display: grid;
      justify-items: center;
      gap: 0.22rem;
      font-size: clamp(1.05rem, 5.8vw, 1.42rem);
      line-height: 1.18;
      text-align: center;
    }

    .cast-list__name,
    .cast-list__role {
      max-width: 100%;
      display: block;
    }

    .cast-list__leader {
      display: none;
      background-image: radial-gradient(circle, currentColor 1px, transparent 1.15px);
      background-position: center 72%;
      background-repeat: repeat-x;
      background-size: 9px 9px;
    }

    .donate-link {
      margin-top: 1.6rem;
      font-size: 0.98rem;
      letter-spacing: 0.06em;
      overflow-wrap: anywhere;
    }

    @keyframes page-fade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @media (min-width: 641px) {
      :root {
        --copy-width: 640px;
        --header-height: 84px;
        --panel-pad-top: calc(var(--header-height) + 2.35rem);
      }

      .site-header__inner {
        flex-direction: row;
        justify-content: space-between;
        gap: 1.5rem;
        text-align: left;
        padding: 0.85rem 1.2rem;
      }

      .header-logo {
        width: 132px;
      }

      .site-nav {
        width: auto;
      }

      .site-nav__links {
        width: auto;
        gap: 0.85rem 1.45rem;
        font-size: 0.8rem;
      }

      .view {
        padding: 1rem 0 2.5rem;
      }

      .hero-logo {
        width: min(100%, 490px);
      }

      .season {
        font-size: 1.3rem;
        letter-spacing: 0.16em;
      }

      .tagline {
        margin-top: 2.4rem;
        font-size: clamp(1.55rem, 3.1vw, 2.25rem);
        line-height: 1.08;
      }

      .credits {
        margin-top: 2.8rem;
        gap: 1.65rem;
      }

      .credit-label,
      .credit-name {
        white-space: nowrap;
      }

      .credit-label {
        font-size: clamp(1.25rem, 2.55vw, 1.75rem);
      }

      .credit-name {
        font-size: clamp(1.45rem, 2.95vw, 2.05rem);
      }

      .section-title {
        font-size: clamp(2.25rem, 4.8vw, 3.9rem);
      }

      .section-subtitle {
        font-size: 0.95rem;
        letter-spacing: 0.05em;
      }

      .gallery-grid {
        margin-top: 2.5rem;
        gap: 1.35rem;
      }

      .cast-list {
        margin-top: 2.3rem;
        gap: 0.95rem;
      }

      .cast-list li {
        display: flex;
        align-items: baseline;
        justify-content: center;
        flex-wrap: nowrap;
        gap: 0.7rem;
        font-size: clamp(1.18rem, 2.55vw, 1.95rem);
        text-align: left;
      }

      .cast-list__name,
      .cast-list__role {
        white-space: nowrap;
      }

      .cast-list__leader {
        display: block;
        flex: 1 1 auto;
        min-width: 1.6rem;
        max-width: none;
        height: 0.85em;
        margin: 0;
      }

      .donate-link {
        margin-top: 2rem;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="shell site-header__inner">
      <button class="header-logo" type="button" data-view-target="home" aria-label="Show Home section">
        <img
          src="https://res.cloudinary.com/dq4ubv7so/image/upload/v1775687430/fd2cf36d-2048-43b4-aaab-cdb9eb3341b0.png"
          alt="BARE film logo"
        >
      </button>

      <nav class="site-nav" aria-label="Primary">
        <div class="site-nav__links">
          <button class="nav-link is-active" type="button" data-view-target="home">Home</button>
          <button class="nav-link" type="button" data-view-target="gallery">Gallery</button>
          <button class="nav-link" type="button" data-view-target="cast">Cast</button>
          <button class="nav-link" type="button" data-view-target="donate">Donate</button>
          <a class="nav-link nav-link--apply" href="https://forms.gle/AWAM1kQQJ6PtZtxq9" target="_blank" rel="noopener noreferrer">Apply</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="view is-active" data-view="home" aria-label="BARE Home">
      <div class="panel">
        <div class="panel__inner">
          <img
            class="hero-logo"
            src="https://res.cloudinary.com/dq4ubv7so/image/upload/v1775687430/fd2cf36d-2048-43b4-aaab-cdb9eb3341b0.png"
            alt="BARE film logo"
          >
          <p class="season film-text">FALL 2026</p>
          <p class="tagline film-text">Before adulthood, there was this.</p>

          <div class="credits film-text" aria-label="Writing credits">
            <div class="credit-block">
              <span class="credit-label">Written &amp; Directed by</span>
              <span class="credit-name">Martin Anazco</span>
            </div>
            <div class="credit-block">
              <span class="credit-label">Co-Written by</span>
              <span class="credit-name">Jacob Collins-Dodd</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="view" data-view="gallery" aria-label="Gallery" hidden>
      <div class="panel">
        <div class="panel__inner">
          <h2 class="section-title film-text">Gallery</h2>
          <p class="section-subtitle">
            <a
              class="text-link"
              href="https://www.instagram.com/officialbaremovie/"
              target="_blank"
              rel="noopener noreferrer"
            >(@officialbaremovie)</a>
          </p>

          <div class="gallery-grid">
            <a
              class="gallery-link"
              href="https://www.instagram.com/p/DW5TDz2DAC-/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Open second BARE gallery image in a new tab"
            >
              <img
                class="gallery-image"
                src="https://res.cloudinary.com/dq4ubv7so/image/upload/v1775704546/SnapInsta.to_663122242_17972677704009114_5945328812382872224_n_vyel9e.jpg"
                alt="Bare Instagram post"
              >
            </a>
            <a
              class="gallery-link"
              href="https://www.instagram.com/p/DW45Sh1EWzt/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Open BARE gallery image in a new tab"
            >
              <img
                class="gallery-image"
                src="https://res.cloudinary.com/dq4ubv7so/image/upload/q_auto/f_auto/v1775694818/31F060B9-D577-482C-84DB-B0CC2D7D4AA2_derdli.jpg"
                alt="BARE gallery still"
              >
            </a>
          </div>
        </div>
      </div>
    </section>

    <section class="view" data-view="cast" aria-label="Cast" hidden>
      <div class="panel">
        <div class="panel__inner">
          <h2 class="section-title film-text">Cast</h2>

          <ul class="cast-list film-text" aria-label="Cast list">
            <li>
              <span class="cast-list__name">Martin Anazco</span>
              <span class="cast-list__leader" aria-hidden="true"></span>
              <span class="cast-list__role">Mickey</span>
            </li>
            <li>
              <span class="cast-list__name">Tristan Aziz</span>
              <span class="cast-list__leader" aria-hidden="true"></span>
              <span class="cast-list__role">Randy</span>
            </li>
            <li>
              <span class="cast-list__name">Alexis Dembowski</span>
              <span class="cast-list__leader" aria-hidden="true"></span>
              <span class="cast-list__role">Russi</span>
            </li>
            <li>
              <span class="cast-list__name">Jacob Collins Dodd</span>
              <span class="cast-list__leader" aria-hidden="true"></span>
              <span class="cast-list__role">Ruben</span>
            </li>
          </ul>
        </div>
      </div>
    </section>

    <section class="view" data-view="donate" aria-label="Donate" hidden>
      <div class="panel">
        <div class="panel__inner">
          <h2 class="section-title film-text">Donate</h2>
          <a
            class="donate-link"
            href="https://www.gofundme.com/f/donate-to-help-raise-budget-for-upcoming-film-bare/fb/o?attribution_id=sl:e62b2e81-7cc9-4df2-bea8-f6983e9e7d60&ts=1775694002&utm_campaign=natman_today_topbar_ios&utm_medium=customer&utm_source=copy_link"
            target="_blank"
            rel="noopener noreferrer"
          >GoFundMe</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var sectionButtons = document.querySelectorAll("[data-view-target]");
      var sections = document.querySelectorAll("[data-view]");
      var navButtons = document.querySelectorAll(".nav-link[data-view-target]");

      function showView(viewName) {
        sections.forEach(function (section) {
          var isActive = section.getAttribute("data-view") === viewName;
          section.classList.toggle("is-active", isActive);
          section.hidden = !isActive;
        });

        navButtons.forEach(function (button) {
          var isActive = button.getAttribute("data-view-target") === viewName;
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-current", isActive ? "page" : "false");
        });
      }

      sectionButtons.forEach(function (control) {
        control.addEventListener("click", function () {
          var viewName = control.getAttribute("data-view-target");
          if (viewName) {
            showView(viewName);
          }
        });
      });
    }());
  </script>
</body>
</html>
